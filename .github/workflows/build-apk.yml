name: Build SalesGO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Flutter create (android)
        run: flutter create --platforms=android --project-name salesgo_agent .

      - name: Add permissions
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = (
            '    <uses-permission android:name="android.permission.INTERNET"/>\n'
            '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
            '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
            '    <uses-permission android:name="android.permission.CAMERA"/>\n'
          )
          if "ACCESS_FINE_LOCATION" not in s:
              s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + "\n" + perms, s, count=1)
          queries = (
            '  <queries>\n'
            '    <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n'
            '    <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="geo"/></intent>\n'
            '  </queries>\n'
          )
          if "<queries>" not in s:
              s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + "\n" + queries, s, count=1)
          s = s.replace('android:label="salesgo_agent"', 'android:label="SalesGO"')
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")
          PY

      - name: Pub get
        run: flutter pub get

      # Brend launcher ikon (xato bo'lsa ham build to'xtamaydi)
      - name: App icon
        continue-on-error: true
        run: |
          pip install pillow
          python3 tools/make_icon.py
          dart pub global activate flutter_launcher_icons
          dart pub global run flutter_launcher_icons

      # Doimiy imzo kaliti: bir marta yaratiladi va repoga saqlanadi.
      # Shunda har build bir xil imzo -> yangi APK eski ustiga o'rnatiladi.
      - name: Stable signing key
        run: |
          mkdir -p ~/.android
          if git cat-file -e HEAD:ci/debug.keystore.b64 2>/dev/null; then
            git show HEAD:ci/debug.keystore.b64 | base64 -d > ~/.android/debug.keystore
            echo "Reused committed keystore"
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p ci
            base64 -w0 ~/.android/debug.keystore > ci/debug.keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ci/debug.keystore.b64
            git commit -m "Add stable signing keystore [skip ci]"
            git push || echo "push failed (keystore used for this build only)"
            echo "Generated new keystore"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesgo-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
