name: Build SalesGO SFA (APK + AAB + Web)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Flutter create (android)
        run: flutter create --platforms=android --org uz.salesgo --project-name salesgo_agent .

      - name: Android sozlamalari (Play talablari)
        run: python3 tools/android_setup.py .

      - name: Pub get
        run: flutter pub get

      - name: Launcher ikon (asl SalesGO belgisi)
        run: |
          dart pub global activate flutter_launcher_icons
          dart pub global run flutter_launcher_icons

      # Imzo: Google Play upload key — GitHub Secrets dan (Settings → Secrets → Actions):
      #   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Kalit hali bo'lmasa: Actions → «Generate upload key» ni bir marta ishga tushiring.
      - name: Imzo kaliti
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload.jks\n" "$KS_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
            echo "SIGNED=release" >> $GITHUB_ENV
            echo "Upload key bilan imzolanadi"
          else
            mkdir -p ~/.android
            if git cat-file -e HEAD:ci/debug.keystore.b64 2>/dev/null; then
              git show HEAD:ci/debug.keystore.b64 | base64 -d > ~/.android/debug.keystore
            fi
            echo "SIGNED=debug" >> $GITHUB_ENV
            echo "::warning::Upload key yo'q — APK sinov (debug) kaliti bilan imzolandi. Google Play uchun kalit qo'shing."
          fi

      - name: Build APK (to'g'ridan-to'g'ri o'rnatish uchun)
        run: flutter build apk --release

      - name: Build AAB (Google Play uchun)
        if: env.SIGNED == 'release'
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salesgo-sfa-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        if: env.SIGNED == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: salesgo-sfa-aab-google-play
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: SalesGO SFA 2.0.${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Web versiya: brauzerdan ko'rish/sinash (APK o'rnatish shart emas) ----
  # https://<login>.github.io/salesgo-agent/ — agent, dostavka, inkassator, supervayzer
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Flutter create (web)
        run: flutter create --platforms=web --org uz.salesgo --project-name salesgo_agent .
      - name: Web sozlamalari (nom, ikonka, rang)
        run: |
          python3 -m pip install --quiet pillow || true
          python3 tools/web_setup.py .
      - name: Pub get
        run: flutter pub get
      - name: Build web
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
