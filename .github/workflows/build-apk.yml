name: Build SalesGO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Flutter create (android)
        run: flutter create --platforms=android --project-name salesgo_agent .

      - name: Add permissions
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = (
            '    <uses-permission android:name="android.permission.INTERNET"/>\n'
            '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
            '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
            '    <uses-permission android:name="android.permission.CAMERA"/>\n'
          )
          if "ACCESS_FINE_LOCATION" not in s:
              s = re.sub(r"(<manifest[^>]*>)", lambda m: m.group(1) + "\n" + perms, s, count=1)
          s = s.replace('android:label="salesgo_agent"', 'android:label="SalesGO"')
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")
          PY

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesgo-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
