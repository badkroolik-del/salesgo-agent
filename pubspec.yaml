name: salesgo_agent
description: SalesGO — savdo agentlari, ekspeditor, inkassator va supervayzerlar uchun mobil ilova
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  cross_file: ^0.3.4
  geolocator: '>=11.0.0 <15.0.0'
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.5
  share_plus: '>=10.1.4 <13.0.0'
  path_provider: ^2.1.5
  # fonda (ilova yopiq bo'lsa ham) GPS trek — foreground servis
  flutter_background_service: '>=5.1.0 <6.0.0'
  permission_handler: '>=11.3.1 <13.0.0'
  battery_plus: '>=6.0.0 <8.0.0'
  device_info_plus: '>=10.0.0 <13.0.0'
  package_info_plus: '>=8.0.0 <10.0.0'

dev_dependencies:
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# Launcher ikon: asl SalesGO belgisi (navy ❯ + yashil ▶), oq fon
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 23
