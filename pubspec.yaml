name: salesgo_agent
description: SalesGO agent mobil ilova
publish_to: 'none'
version: 1.6.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.5
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

# Launcher ikon (foydalanuvchi bergan aniq logo — assets/icon/icon.png)
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E9A5A"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
